# applies the @thm_* palette set by dark.conf / light.conf.
# style options and the tmux-cpu colors are baked in with -F here; the
# status/window formats in .tmux.conf read #{@thm_*} live at render time.
# styles use space-separated attributes (no commas) so they stay safe
# inside #{?cond,a,b} conditionals.
set -gF status-style "bg=default fg=#{@thm_fg}"
set -gF message-style "bg=default fg=#{@thm_message} bold"
set -gF message-command-style "bg=default fg=#{@thm_message}"
set -gF mode-style "bg=#{@thm_selection} fg=#{@thm_fg}"
set -gF clock-mode-colour "#{@thm_accent}"
set -gF pane-border-style "fg=#{@thm_dim}"
set -gF pane-active-border-style "fg=#{@thm_border_active}"
set -gF window-status-activity-style "fg=#{@thm_battery}"
set -gF window-status-bell-style "fg=#{@thm_warn} bold"

# cpu percentage color by load (tmux-cpu reads these at runtime)
set -gF @cpu_low_fg_color "#[fg=#{@thm_fg}]"
set -gF @cpu_medium_fg_color "#[fg=#{@thm_warn}]"
set -gF @cpu_high_fg_color "#[fg=#{@thm_crit} bold]"

# redraw now instead of waiting for status-interval (skipped at server start)
if -F "#{client_name}" "refresh-client -S"
