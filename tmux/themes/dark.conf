set -g @thm_dim "#6c7086"
set -g @thm_sep "#45475a"
set -g @thm_selection "#45475a"
set -g @thm_accent "#89b4fa"
set -g @thm_session "#a6e3a1"
set -g @thm_prefix "#f38ba8"
