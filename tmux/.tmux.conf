set -g default-shell /bin/zsh

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# remove bell sound
set-option -g bell-action none
set-option -g visual-bell on

# automatic window renaming
set-option -g allow-rename off
set-option -g automatic-rename off

# visual notification of activity in other windows
set -g visual-activity on

# split panes using | and -
bind | split-window -h -c '#{pane_current_path}' # split vertically
bind - split-window -v -c '#{pane_current_path}' # split horizontally
unbind '"'
unbind %

# bind current path to new window
bind c new-window -c '#{pane_current_path}'

# enable mouse mode (tmux 2.1+)
setw -g mouse on

# default terminal
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

# set vim keybindings
setw -g mode-keys vi

# faster command sequences
# https://mutelight.org/practical-tmux#section-4
set -s escape-time 0

# aggressive resize
# https://mutelight.org/practical-tmux#section-5
set -g aggressive-resize on

# clipboard
run-shell 'if [ -n "$WAYLAND_DISPLAY" ]; then \
               tmux set-option -g @override_copy_command "wl-copy"; \
           elif [ -n "$DISPLAY" ]; then \
               tmux set-option -g @override_copy_command "xclip -selection clipboard"; \
           else \
               tmux set-option -g @override_copy_command "cat"; \
           fi'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '#{@override_copy_command}'

# pane styling
set -g pane-border-status top

# recommended text colors
#   red:
#       colour203 (#ff5f5f)
#       colour167 (#d75f5f)
#       colour210 (#ff8787)
#       colour131 (#af5f5f)
#   green:
#       colour114 (#87d787)
#       colour108 (#87af87)
#       colour78  (#5fd787)
#       colour71  (#5faf5f)
#   blue:
#       colour111 (#87afff)
#       colour75  (#5fafff)
#       colour110 (#87afd7)
#       colour68  (#5f87d7)
set -g pane-border-format "#{?@label,#[fg=color203 bold] #{@label} ,#{pane_current_command}}"

# pane rename command
bind T run-shell "~/dotfiles/tmux/rename-pane.sh"

# reload config file
unbind r
bind r source-file ~/.tmux.conf

# configure catppuccin theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_status_style "rounded"

# configure cattpuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# status line
set-option -g status-position top
set-option -g status-right-length 100
set -g status-left ""
set -g status-right "#{weather} "
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time} "

# plugins
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'xamut/tmux-weather'

# initialize tmux plugin manager
run -b '~/.tmux/plugins/tpm/tpm'
