set -g default-shell /bin/zsh

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# remove bell sound
set-option -g bell-action none
set-option -g visual-bell on

# automatic window renaming
set-option -g allow-rename off
set-option -g automatic-rename off

# visual notification of activity in other windows
set -g visual-activity on

# split panes using | and -
bind | split-window -h -c '#{pane_current_path}' # split vertically
bind - split-window -v -c '#{pane_current_path}' # split horizontally
unbind '"'
unbind %

# bind current path to new window
bind c new-window -c '#{pane_current_path}'

# enable mouse mode (tmux 2.1+)
setw -g mouse on

# default terminal
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

# set vim keybindings
setw -g mode-keys vi

# faster command sequences
# https://mutelight.org/practical-tmux#section-4
set -s escape-time 0

# aggressive resize
# https://mutelight.org/practical-tmux#section-5
set -g aggressive-resize on

# clipboard
run-shell 'if [ -n "$WAYLAND_DISPLAY" ]; then \
               tmux set-option -g @override_copy_command "wl-copy"; \
           elif [ -n "$DISPLAY" ]; then \
               tmux set-option -g @override_copy_command "xclip -selection clipboard"; \
           else \
               tmux set-option -g @override_copy_command "cat"; \
           fi'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '#{@override_copy_command}'

# pane styling
set -g pane-border-status top

# recommended text colors
#   red:
#       colour203 (#ff5f5f)
#       colour167 (#d75f5f)
#       colour210 (#ff8787)
#       colour131 (#af5f5f)
#   green:
#       colour114 (#87d787)
#       colour108 (#87af87)
#       colour78  (#5fd787)
#       colour71  (#5faf5f)
#   blue:
#       colour111 (#87afff)
#       colour75  (#5fafff)
#       colour110 (#87afd7)
#       colour68  (#5f87d7)
set -g pane-border-format "#{?@label,#[fg=color203 bold] #{@label} ,#{pane_current_command}}"

# pane rename command
bind T run-shell "~/dotfiles/tmux/rename-pane.sh"

# reload config file
unbind r
bind r source-file ~/.tmux.conf

# theme: plain transparent status line with a light and a dark palette
# (tmux/themes/{dark,light}.conf). the terminal reports its light/dark mode
# (Ghostty supports this) and the hooks swap palettes live; dark is the
# fallback when the terminal reports nothing.
source-file ~/dotfiles/tmux/themes/dark.conf
if -F "#{==:#{client_theme},light}" "source-file ~/dotfiles/tmux/themes/light.conf"
set-hook -g client-dark-theme "source-file ~/dotfiles/tmux/themes/dark.conf"
set-hook -g client-light-theme "source-file ~/dotfiles/tmux/themes/light.conf"

# windows (colors read from the active palette at render time;
# icons are Nerd Font codepoints: \uXXXX for 4 digits, \UXXXXXXXX for 8;
# man tmux says \uXXXXXXXX but 3.7c only reads 4 digits after a lowercase \u)
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@thm_dim}] #I #W "
set -g window-status-current-format "#[fg=#{@thm_accent} bold] #I #[fg=#{@thm_fg} bold]#W "

# battery icons (tmux-battery)
set -g @batt_icon_charge_tier8 "\U000F0079"
set -g @batt_icon_charge_tier7 "\U000F0081"
set -g @batt_icon_charge_tier6 "\U000F007F"
set -g @batt_icon_charge_tier5 "\U000F007E"
set -g @batt_icon_charge_tier4 "\U000F007D"
set -g @batt_icon_charge_tier3 "\U000F007C"
set -g @batt_icon_charge_tier2 "\U000F007B"
set -g @batt_icon_charge_tier1 "\U000F007A"
set -g @batt_icon_status_charged "\U000F06A5"
set -g @batt_icon_status_charging "\U000F0084"
set -g @batt_icon_status_discharging "\U000F0083"
set -g @batt_icon_status_unknown "\U000F0091"
set -g @batt_icon_status_attached "\U000F1211"

# status line (responsive: modules drop out as the client gets narrower)
#   weather │ session │ cpu │ battery │ date
set-option -g status-position top
set-option -g status-right-length 100
set -g status-left ""
set -g status-right "#{?#{e|>=:#{client_width},160},#[fg=#{@thm_weather}]\uF2C9 #[fg=#{@thm_fg}]#{weather}#[fg=#{@thm_sep}] │ ,}"
set -ag status-right "#[fg=#{?client_prefix,#{@thm_prefix},#{@thm_session}}]\uE795 #[fg=#{@thm_fg} bold]#S#[nobold]"
set -ag status-right "#{?#{e|>=:#{client_width},130},#[fg=#{@thm_sep}] │ #[fg=#{@thm_cpu}]\uF2DB #{cpu_fg_color}#{cpu_percentage},}"
set -ag status-right "#{?#{e|>=:#{client_width},110},#[fg=#{@thm_sep}] │ #[fg=#{@thm_battery}]#{battery_icon} #[fg=#{@thm_fg}]#{battery_percentage},}"
set -ag status-right "#[fg=#{@thm_sep}] │ #[fg=#{@thm_date}]\U000F00F0 #[fg=#{@thm_fg}]#{?#{e|<:#{client_width},100},%H:%M,%Y-%m-%d %H:%M} "

# plugins
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'xamut/tmux-weather'

# initialize tmux plugin manager
run -b '~/.tmux/plugins/tpm/tpm'
